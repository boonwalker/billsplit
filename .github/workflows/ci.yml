# Checks every push and pull request: types, unit/API tests, build and the click tests.
# Railway can wait for this check before deploying ("Wait for CI" in the service settings).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit- und API-Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Chromium für die Klick-Tests
        run: npx playwright install --with-deps chromium
      - name: Klick-Tests
        run: npm run test:e2e
      - name: Bericht bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
