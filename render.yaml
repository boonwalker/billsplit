# Render Blueprint: Dashboard → "New" → "Blueprint" → dieses Repo auswählen.
# Legt den billsplit-Server mit dauerhaftem Speicher für die Rechnungen an.
services:
  - type: web
    name: billsplit
    runtime: node
    # Persistente Disks gibt es nur auf bezahlten Instanzen.
    plan: starter
    region: frankfurt
    branch: main
    # Live-Updates und Rechnungen liegen auf genau einer Instanz – nicht hochskalieren.
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      # Render sitzt als Proxy davor; die Client-Adresse für die Limits steht in X-Forwarded-For.
      - key: TRUST_PROXY
        value: "1"
      # Optional: aktiviert die KI-Belegerkennung. Render fragt den Wert beim Anlegen ab.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Belegfotos pro Gerät und Stunde bzw. insgesamt pro Tag (begrenzt die KI-Kosten).
      - key: RECEIPT_LIMIT_PER_HOUR
        value: "10"
      - key: RECEIPT_LIMIT_PER_DAY
        value: "300"
    disk:
      name: billsplit-data
      mountPath: /var/data
      sizeGB: 1
